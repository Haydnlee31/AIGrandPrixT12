services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: common_thread
      POSTGRES_USER: prototype
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prototype -d common_thread"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
