<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save to Mymah Finds</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" type="module"></script>
</head>
<body class="popup">
  <header><span class="eyebrow">Mymah Finds</span><button id="settings" type="button" class="text-button">Settings</button></header>
  <main>
    <h1>Save a find.</h1>
    <p>Keep this page in your Library, with a note for later.</p>
    <form id="capture">
      <fieldset id="capture-fields" disabled>
        <label>Page link<input name="url" type="url" required readonly maxlength="2048"></label>
        <label>Page title<input name="title" required maxlength="300"></label>
        <label>Selected text<textarea name="selected_text" maxlength="12000" rows="3" placeholder="Select text on the page before opening this popup, or add it here."></textarea></label>
        <label>Add a note<textarea name="note" maxlength="2000" rows="2" placeholder="Optional. What would you like to remember?"></textarea></label>
        <details id="workspace-access">
          <summary>Workspace access</summary>
          <label>API token<input name="token" type="password" required autocomplete="off" spellcheck="false" placeholder="Workspace token"></label>
          <p class="hint">Kept for this browser session. Closing the browser clears it.</p>
        </details>
        <button id="save" type="submit">Save to Library</button>
      </fieldset>
    </form>
    <p id="status" role="status" aria-live="polite">Reading this page…</p>
    <button id="new-capture" type="button" class="secondary" hidden>Start a new save</button>
  </main>
  <footer><a id="library" target="_blank" rel="noopener noreferrer">Open Library ↗</a><p class="hint">Backend: <span id="backend"></span></p></footer>
</body>
</html>
