[project]
name = "common-thread"
version = "0.4.0"
description = "Evidence-backed cross-platform discovery application"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "httpx>=0.27,<1", "Pillow>=11.3,<13", "vercel-queue==0.10.0", "PyJWT[crypto]>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.vercel]
entrypoint = "app:app"

[[tool.vercel.subscribers]]
entrypoint = "backend.app.vercel_jobs"

[tool.vercel.scripts]
build = "python scripts/migrate_deployment.py"
